name: CADR CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v3

    - name: apt update
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y build-essential

    - name: Install GHDL
      run: sudo apt-get install -y ghdl-llvm

    - name: Fix libLLVM-18.so.18.1 path (symlink)
      run: sudo ln -s /lib/x86_64-linux-gnu/libLLVM.so.18.1 /lib/x86_64-linux-gnu/libLLVM-18.so.18.1	

    - name: Regen
      run: make regen

    - name: Build with ghdl
      run: make clean && CADR4_HDLCOMPILER=ghdl make

    - name: Install nvc 1.22.1
      run: |
        wget https://github.com/nickg/nvc/releases/download/r1.22.1/nvc_1.22.1-1_amd64_ubuntu-24.04.deb
        sudo apt-get install -y ./nvc_1.22.1-1_amd64_ubuntu-24.04.deb

    - name : Build with nvc
      run: make clean && CADR4_HDLCOMPILER=nvc make
